# Override file for development
# Use: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  backend:
    # Override for development with live reload
    volumes:
      - .:/app:cached
      - /app/__pycache__
    environment:
      - DEBUG=true
      - LOG_level=DEBUG
    # Enable development mode with auto-reload
    command: chainlit run app.py --host 0.0.0.0 --port 8000 --watch

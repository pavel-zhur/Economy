# Build Pipeline для системы финансового планирования
# Сборка React приложения и публикация артефакта для Release Pipeline

trigger:
- master
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'
  buildPath: 'playgrounds/cursor/build'
  workingDirectory: 'playgrounds/cursor'

jobs:
- job: BuildReactApp
  displayName: 'Build React Application'
  steps:
  - checkout: self
    displayName: 'Checkout source code'
  
  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: 'Install Node.js $(nodeVersion)'
  
  # Кэширование npm зависимостей
  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | $(workingDirectory)/package-lock.json'
      path: $(workingDirectory)/node_modules
    displayName: 'Cache npm dependencies'
  
  - script: npm ci
    displayName: 'Install dependencies'
    workingDirectory: $(workingDirectory)
  
  - script: npm run build
    displayName: 'Build React application'
    workingDirectory: $(workingDirectory)
    env:
      CI: false  # Отключаем обработку warnings как ошибок
  
  - script: |
      echo "Build completed successfully!"
      echo "Build artifacts:"
      ls -la build/
      echo "Package info:"
      cat package.json | grep '"name"\|"version"'
      echo "Build size:"
      du -sh build/
    displayName: 'Display build info'
    workingDirectory: $(workingDirectory)
  
  # Копируем статическую конфигурацию в build folder
  - task: CopyFiles@2
    inputs:
      sourceFolder: '$(workingDirectory)'
      contents: 'staticwebapp.config.json'
      targetFolder: '$(buildPath)'
    displayName: 'Copy Static Web App config'
  
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(buildPath)'
      artifactName: 'react-build'
      publishLocation: 'Container'
    displayName: 'Publish build artifacts'
  
  # Опционально: публикуем также package.json для информации о версии
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(workingDirectory)/package.json'
      artifactName: 'package-info'
      publishLocation: 'Container'
    displayName: 'Publish package info' 
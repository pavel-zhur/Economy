services:
  # React приложение для разработки
  financial-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:3001
    stdin_open: true
    tty: true
    profiles:
      - dev

  # React приложение для продакшена
  financial-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    profiles:
      - prod

  # Заглушка для API сервера (будущее расширение)
  api-server:
    image: node:18-alpine
    command: sh -c "echo 'API Server placeholder - will be implemented later' && sleep infinity"
    ports:
      - "3001:3001"
    profiles:
      - dev 
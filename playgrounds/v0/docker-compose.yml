version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      # Для разработки: монтируем исходный код
      - .:/app
      - /app/node_modules
      - /app/.next
    # Для production убрать volumes выше и использовать только:
    # restart: unless-stopped
    
  # Можно добавить дополнительные сервисы в будущем:
